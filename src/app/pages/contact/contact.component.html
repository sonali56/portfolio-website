<h2 class="section-title">Contact Me</h2>
<div class="contact-container">
    <!-- Contact Form -->
    <div class="contact-form">
        <h3>Send Me a Message</h3>
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" [(ngModel)]="contactData.name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="contactData.email" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" [(ngModel)]="contactData.message" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

    <!-- Social Links -->
    <div class="social-links">
        <h3>Connect With Me</h3>
        <div class="social-list">
            <a href="https://www.linkedin.com/in/sonali-dholam-fullstackdeveloper/" target="_blank" class="social-item">
                <fa-icon [icon]="faLinkedin" class="icon"></fa-icon>
                <div>
                    <div class="label">LinkedIn</div>
                    <div class="description">Let's connect professionally</div>
                </div>
            </a>
            <a href="https://github.com/sonali56" target="_blank" class="social-item">
                <fa-icon [icon]="faGithub" class="icon"></fa-icon>
                <div>
                    <div class="label">GitHub</div>
                    <div class="description">Check out my code</div>
                </div>
            </a>
        </div>
    </div>
</div>
