<div class="projects-container">
  <!-- Featured Projects Section -->
  <section class="section featured-projects">
    <h2 class="section-title">Featured Projects</h2>
    <div class="projects-grid">
      <div class="project-card featured" *ngFor="let project of getFeaturedProjects()">
        <div class="project-image">
          <img [src]="project.image" [alt]="project.title">
          <div class="project-links">
            <a [href]="project.githubUrl" target="_blank" rel="noopener noreferrer" class="project-link">
              <fa-icon [icon]="faGithub"></fa-icon>
            </a>
            <a [href]="project.liveUrl" target="_blank" rel="noopener noreferrer" class="project-link">
              <fa-icon [icon]="faExternalLink"></fa-icon>
            </a>
          </div>
        </div>
        <div class="project-content">
          <h3 class="project-title">{{project.title}}</h3>
          <p class="project-description">{{project.description}}</p>
          <div class="project-technologies">
            <span class="technology-tag" *ngFor="let tech of project.technologies">{{tech}}</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Other Projects Section -->
  <section class="section other-projects">
    <h2 class="section-title">Other Projects</h2>
    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of getNonFeaturedProjects()">
        <div class="project-image">
          <img [src]="project.image" [alt]="project.title">
          <div class="project-links">
            <a [href]="project.githubUrl" target="_blank" rel="noopener noreferrer" class="project-link">
              <fa-icon [icon]="faGithub"></fa-icon>
            </a>
            <a [href]="project.liveUrl" target="_blank" rel="noopener noreferrer" class="project-link">
              <fa-icon [icon]="faExternalLink"></fa-icon>
            </a>
          </div>
        </div>
        <div class="project-content">
          <h3 class="project-title">{{project.title}}</h3>
          <p class="project-description">{{project.description}}</p>
          <div class="project-technologies">
            <span class="technology-tag" *ngFor="let tech of project.technologies">{{tech}}</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
