<div class="home-container">
    <!-- Fixed Navigation Menu -->
    <nav class="fixed-nav">
        <div class="nav-content">
            <div class="nav-brand">
                <h1>Sonali D.</h1>
            </div>
            <div class="nav-menu">
                <a href="#hero" class="menu-item" [class.active]="activeSection === 'hero'">
                    Home
                </a>
                <a href="#about" class="menu-item" [class.active]="activeSection === 'about'">
                    About
                </a>
                <a href="#experience" class="menu-item" [class.active]="activeSection === 'experience'">
                    Experience
                </a>
                <a href="#projects" class="menu-item" [class.active]="activeSection === 'projects'">
                    Projects
                </a>
                <a href="#contact" class="menu-item" [class.active]="activeSection === 'contact'">
                    Contact
                </a>
            </div>
            <div class="nav-actions">
                <app-theme-toggle></app-theme-toggle>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Hero Section -->
        <section id="hero" class="section hero-section text-center">
            <div class="profile-container">
                <div class="profile-image-container">
                    <img src="assets/picofme (14).png" alt="Profile Picture" class="profile-image">
                </div>
            </div>
            <h1 class="display-4 mb-3">Hi, I'm Sonali Dholam</h1>
            <div class="typed-container mb-4">
                <span>I'm a </span>
                <span id="typed-text"></span>
            </div>
            <div class="hero-buttons">
                <a href="assets/resume.pdf" target="_blank" class="btn btn-primary">
                    <fa-icon [icon]="faFileAlt" class="me-2"></fa-icon>
                    Resume
                </a>
                <a href="#contact" class="btn btn-outline">
                    <fa-icon [icon]="faEnvelope" class="me-2"></fa-icon>
                    Contact Me
                </a>
            </div>
        </section>

        <!-- About Section -->
        <section id="about" class="section about-section">
            <app-about></app-about>
        </section>

        <!-- Experience Section -->
        <section id="experience" class="section experience-section">
            <h2 class="section-title">Experience</h2>
            <app-experience></app-experience>
        </section>

        <!-- Projects Section -->
        <section id="projects" class="section projects-section">
            <h2 class="section-title">Projects</h2>
            <app-projects></app-projects>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="section contact-section">
            <app-contact></app-contact>
        </section>

        <!-- Wave Divider -->
        <div class="wave-divider">
            <svg viewBox="0 0 1440 100" preserveAspectRatio="none">
                <path fill="currentColor" d="M0,40 C280,100 660,0 1440,50 L1440,100 L0,100 Z"></path>
            </svg>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                &copy; 2024 Sonali Dholam. Built with 💙 and Angular.
            </div>
        </footer>
    </main>
</div>
