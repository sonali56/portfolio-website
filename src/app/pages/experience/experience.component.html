<!-- Technical Expertise -->
<div class="tech-expertise">
  <h2 class="section-title">
    <span class="icon">🚀</span> Technical Expertise
  </h2>

  <!-- Frontend Technologies -->
  <div class="tech-category">
    <h3 class="category-title">
      <fa-icon [icon]="faCode" class="category-icon"></fa-icon>
      Frontend
    </h3>
    <div class="tech-bubbles">
      <div class="tech-bubble">
        <fa-icon [icon]="faAngular" class="tech-icon"></fa-icon>
        Angular
      </div>
      <div class="tech-bubble">
        <fa-icon [icon]="faReact" class="tech-icon"></fa-icon>
        React
      </div>
      <div class="tech-bubble">
        <fa-icon [icon]="faHtml5" class="tech-icon"></fa-icon>
        HTML5
      </div>
      <div class="tech-bubble">
        <fa-icon [icon]="faCss3" class="tech-icon"></fa-icon>
        CSS3
      </div>
      <div class="tech-bubble">
        <fa-icon [icon]="faSass" class="tech-icon"></fa-icon>
        SCSS
      </div>
      <div class="tech-bubble">
        <fa-icon [icon]="faJs" class="tech-icon"></fa-icon>
        JavaScript
      </div>
      <div class="tech-bubble">
        <img src="assets/typescript.svg" alt="TypeScript" class="tech-icon">
        TypeScript
      </div>
    </div>
  </div>

  <!-- Backend Technologies -->
  <div class="tech-category">
    <h3 class="category-title">
      <fa-icon [icon]="faServer" class="category-icon"></fa-icon>
      Backend
    </h3>
    <div class="tech-bubbles">
      <div class="tech-bubble">
        <fa-icon [icon]="faNodeJs" class="tech-icon"></fa-icon>
        Node.js
      </div>
      <div class="tech-bubble">
        <img src="assets/express.svg" alt="Express.js" class="tech-icon">
        Express.js
      </div>
      <div class="tech-bubble">
        <fa-icon [icon]="faServer" class="tech-icon"></fa-icon>
        RESTful APIs
      </div>
      <div class="tech-bubble">
        <img src="assets/mongodb.svg" alt="MongoDB" class="tech-icon">
        MongoDB
      </div>
    </div>
  </div>

  <!-- Development Tools -->
  <div class="tech-category">
    <h3 class="category-title">
      <fa-icon [icon]="faTools" class="category-icon"></fa-icon>
      Development Tools
    </h3>
    <div class="tech-bubbles">
      <div class="tech-bubble">
        <fa-icon [icon]="faGitAlt" class="tech-icon"></fa-icon>
        Git
      </div>
      <div class="tech-bubble">
        <fa-icon [icon]="faNpm" class="tech-icon"></fa-icon>
        npm/yarn
      </div>
      <div class="tech-bubble">
        <img src="assets/webpack.svg" alt="Webpack" class="tech-icon">
        Webpack
      </div>
      <div class="tech-bubble">
        <img src="assets/vscode.svg" alt="VS Code" class="tech-icon">
        VS Code
      </div>
      <div class="tech-bubble">
        <img src="assets/postman.svg" alt="Postman" class="tech-icon">
        Postman
      </div>
    </div>
  </div>
</div>
